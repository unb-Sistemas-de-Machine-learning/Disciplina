---
layout: default
---

<div class="coursera-page">
  <div class="page-header">
    <h1><i class="fas fa-file-alt"></i> {{ page.title }}</h1>
    <p>{{ content }}</p>
  </div>

  <div class="posts-grid">
    {% for post in site.posts %}
    <div class="post-card">
      <div class="post-icon">
        <i class="fas fa-newspaper"></i>
      </div>
      <div class="post-content">
        <h3 class="post-title">
          <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        </h3>
        {% if post.date %}
        <span class="post-date"><i class="fas fa-calendar-alt"></i> {{ post.date | date: "%d/%m/%Y" }}</span>
        {% endif %}
        <div class="post-links">
          {% if post.pdf %}
          <a href="{{ post.pdf }}" target="_blank" class="post-link">
            <i class="fas fa-link"></i> Ver material
          </a>
          {% endif %}
          {% if post.attachment %}
          <a href="{{ post.attachment | prepend: site.baseurl }}" class="post-link">
            <i class="fas fa-file-archive"></i> Download
          </a>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
